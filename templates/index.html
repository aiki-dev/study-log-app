<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Study App</title>
</head>
<body>
    <h1>勉強記録アプリ</h1>
    <!-- 学習記録を入力するフォーム -->
    <form method="POST">
        <p>日付</p>
        <input type="date" name="study_date">

        <p>科目</p>
        <input type="text" name="subject" placeholder="科目を入力してください">

        <p>勉強時間（分）</p>
        <input type="text" name="study_time" placeholder="学習時間を入力してください">

        <br><br>
        <button type="submit">送信</button>
    </form>

    <!-- Flaskから渡されたメッセージを表示 -->
    <p>{{msg}}</p>
    <p>{{error}}</p>
</body>
</html>
